# General information
title: The Rabbit Haul
website: https://calderainteractive.com

# Simple and short description block for your product
description: The Rabbit Haul is a roguelite farming and tower defense game that challenges you to grow crops, build symbiotic defenses, and protect your haul from the thieving Trash Panda Posse as you rebuild your hometown one run at a time.

# The product history
histories:
  - header: Farm by Day. Defend by Night. Do It Again.
    text: Play as Sprout, a determined rabbit trying to rebuild their hometown after it has been torn apart by the mischievous Trash Panda Posse. By day, Sprout farms with purpose. You grow crops, build defensive plant towers, and shape your garden into something that can stand strong when night falls. Smart plant synergies and well-placed defenses will be the difference between keeping your haul safe… or watching it disappear! Take your time. Plan carefully. The night is just around the corner.

  - header: Time to Put Some Pesky Raccoons in Their Place!
    text: Before you know it, it’s dark out, and the Trash Panda Posse comes in waves. Raccoons swarm Sprout’s farm, each with their own set of tricks and behaviors, all trying to steal away your hard-earned crops! As the days go on, waves grow tougher, enemies get smarter, and your garden will need all the help it can get. Upgrade your towers, explore for stronger weapons, and fight hard to make it through until morning. Every night tests the care and thought you put into your garden during the day. So act, and choose wisely.

  - header: A Roguelite Loop Built on Preparation and Pressure
    text: Each run pushes Sprout a little further. The garden evolves and grows with every passing day -  every run is an opportunity to try a new strategy. allowing you to explore, find treasure, quests, upgrades, weapons,  and unexpected helpers or hindrances. When your run ends, all is not lost. You rebuild, unlock new options, and head back out better prepared for the next attempt. Failure is not the end. It’s part of the plan. Starting over doesn’t mean starting from scratch.

  - header: Rebuild the Town, One Haul at a Time
    text: Between runs, Sprout returns home with what crops they managed to save. Use your hard-earned harvests to restore shops, rebuild homes, and unlock new characters, merchants, and upgrades. As the town comes back to life, so do new systems, tools, and ways to survive the nights ahead. The stronger the town becomes, the tougher the challenges ahead.

  - header: Find Your Playstyle
    text: With a wide variety of crops, defensive towers, weapons, and upgrade paths, The Rabbit Haul encourages creativity. Help Sprout build a farm that overwhelms enemies with raw plant power, or one that relies on clever synergies, or something entirely your own! There is no single right way to survive. Just different ways to grow your garden, learn new techniques, and better prepare for when the sun sets. What are you waiting for? It’s time to dig in!

  - header: Kick Trash Panda Posse Butts in Style
    text: Unlock outfits as you rebuild the town and progress through runs. Try out a variety of looks, from cozy farmer to dripping in style, customize Sprout to reflect your mood! Match your weapon to lean into the vibe of your run! The more you play and explore, the more you unlock. Because looking good while defending your haul ~matters~.

